services:
  docindex:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      FLASK_DEBUG: "false"
    volumes:
      - docindex_data:/app/instance
      - docindex_uploads:/app/uploads
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # If your AI server (Ollama, LM Studio) runs on the host machine,
    # use http://host.docker.internal:<port>/v1 as AI_BASE_URL instead of localhost.

volumes:
  docindex_data:
  docindex_uploads:
