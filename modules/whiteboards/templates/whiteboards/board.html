{% extends "base.html" %}
{% block title %}{{ board.name[:-7] if board.name.endswith('.wboard') else board.name }} - Whiteboard{% endblock %}
{% block content %}
<div class="w-full mx-auto max-w-[95%] p-6 pb-10 flex flex-col gap-4 min-h-full">
    <div class="flex items-center gap-3 flex-wrap">
        <a href="{{ url_for('whiteboards.index') }}" class="btn btn-ghost btn-sm gap-1" title="All boards">
            <i class="fas fa-arrow-left"></i> Boards
        </a>
        <h1 class="text-xl font-bold truncate flex-1 min-w-0">{{ board.name[:-7] if board.name.endswith('.wboard') else board.name }}</h1>
        <span id="wb-save-state" class="text-xs opacity-50">Saved</span>
        <button type="button" id="wb-retry-save" class="btn btn-ghost btn-xs hidden" title="Saving failed — try again now">Retry now</button>
        <button type="button" id="wb-load-remote" class="btn btn-ghost btn-xs hidden" title="Discard unsaved changes and load the server version">Load remote</button>
        <button type="button" id="wb-export" class="btn btn-ghost btn-sm gap-1" title="Export as PNG">
            <i class="fas fa-image"></i><span class="hidden sm:inline">PNG</span>
        </button>
        <form method="POST" action="{{ url_for('whiteboards.lock' if not scene.ai_lock else 'whiteboards.unlock', file_id=board.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-ghost btn-sm gap-1" title="{{ 'AI edits locked — click to unlock' if scene.ai_lock else 'Lock against AI edits' }}">
                <i class="fas {{ 'fa-lock text-warning' if scene.ai_lock else 'fa-lock-open' }}"></i>
            </button>
        </form>
        <form method="POST" action="{{ url_for('whiteboards.hide' if not scene.ai_hidden else 'whiteboards.unhide', file_id=board.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-ghost btn-sm gap-1" title="{{ 'Hidden from the AI — click to unhide' if scene.ai_hidden else 'Hide from the AI' }}">
                <i class="fas {{ 'fa-eye-slash' if scene.ai_hidden else 'fa-eye' }}"></i>
            </button>
        </form>
    </div>

    <div id="wb-root" class="rounded-2xl border border-base-content/10 overflow-hidden" style="height: calc(100vh - 220px); min-height: 420px;">
        <div data-wb-loading class="flex items-center justify-center h-full opacity-50 text-sm gap-2">
            <i class="fas fa-circle-notch fa-spin"></i> Loading the board editor…
        </div>
    </div>

    <!-- Import-failure surface: cloned into #wb-root when the editor
         bundle fails to load. Mirrors the dashboards chart-loader error
         box (bold title + reason + retry affordance). -->
    <template id="wb-load-error-tpl">
        <div data-wb-load-error class="alert alert-error m-6" role="alert">
            <i class="fas fa-triangle-exclamation"></i>
            <div class="flex-1 text-left">
                <b>board unavailable</b>
                <p class="text-sm">The board editor failed to load.</p>
            </div>
            <button type="button" id="wb-retry" class="btn btn-sm">Retry</button>
        </div>
    </template>

    <!-- Toast container for editor runtime failures (e.g. PNG export). -->
    <div id="wb-toast-wrap" class="toast toast-bottom toast-center z-[70]"></div>
</div>

<script type="module">
    // Toast helper for editor runtime failures (PNG export, remote load).
    // The React bundle calls this; it is defined here so it exists before
    // the bundle loads and works even if the bundle never mounts.
    window.WB_toast = function (msg) {
        var wrap = document.getElementById("wb-toast-wrap");
        if (!wrap || !msg) {
            return;
        }
        var t = document.createElement("div");
        t.className = "alert alert-error";
        t.setAttribute("role", "alert");
        var icon = document.createElement("i");
        icon.className = "fas fa-triangle-exclamation";
        var span = document.createElement("span");
        span.textContent = msg;
        t.appendChild(icon);
        t.appendChild(span);
        wrap.appendChild(t);
        setTimeout(function () { t.remove(); }, 5000);
    };
    // The editor bundle only auto-executes on full page loads; SPA
    // navigations reuse the cached module, so mount explicitly every
    // time (mount() unmounts any previous root first). Dynamic import()
    // works here even when the SPA router re-runs this inline script.
    window.WB_CONFIG = {
        sceneUrl: {{ url_for('whiteboards.api_scene', file_id=board.id) | tojson }},
        saveUrl: {{ url_for('whiteboards.api_save', file_id=board.id) | tojson }},
        csrfToken: {{ csrf_token() | tojson }},
        initialScene: {{ scene | tojson }},
        initialVersion: {{ version | tojson }},
        readOnly: {{ 'true' if board.drive and board.drive.is_readonly else 'false' }}
    };
    // Lets the AI chat treat this board as the open file (chip + context,
    // mirrors notebooks edit page and drive/view.html).
    window.currentFile = { id: {{ board.id }}, name: {{ (board.name[:-7] if board.name.endswith('.wboard') else board.name)|tojson }} };
    // Import-failure surface: a failed bundle import used to leave the
    // loading spinner up forever with only a console.error. Now the root
    // swaps to the error box above, whose Retry button re-attempts the
    // import in place (no full page reload needed).
    function wbShowLoadError() {
        var root = document.getElementById("wb-root");
        if (!root || root.querySelector("[data-wb-load-error]")) {
            return;
        }
        var tpl = document.getElementById("wb-load-error-tpl");
        root.innerHTML = "";
        if (tpl && tpl.content) {
            root.appendChild(tpl.content.cloneNode(true));
        } else {
            var fallback = document.createElement("div");
            fallback.className = "alert alert-error m-6";
            fallback.setAttribute("role", "alert");
            fallback.textContent = "The board editor failed to load.";
            root.appendChild(fallback);
        }
        var btn = document.getElementById("wb-retry");
        if (btn) {
            btn.addEventListener("click", function () { wbTryMount(); });
        }
    }
    function wbShowLoading() {
        var root = document.getElementById("wb-root");
        if (!root) {
            return;
        }
        root.innerHTML = '<div data-wb-loading class="flex items-center justify-center h-full opacity-50 text-sm gap-2">'
            + '<i class="fas fa-circle-notch fa-spin"></i> Loading the board editor…</div>';
    }
    async function wbTryMount() {
        var root = document.getElementById("wb-root");
        // Reset to the spinner only when the editor is not already mounted
        // (a canvas means a previous mount survived, e.g. SPA re-run:
        // mount() below unmounts and remounts it, as before).
        if (root && !root.querySelector("[data-wb-loading]")
            && !root.querySelector("canvas")) {
            wbShowLoading();
        }
        try {
            if (!window.WhiteboardEditor) {
                await import('{{ url_for('whiteboards.static', filename='dist/wb-editor.js') }}?v=2');
            }
            window.WhiteboardEditor?.mount?.();
        } catch (err) {
            console.error('Whiteboard editor failed to load:', err);
            wbShowLoadError();
        }
    }
    wbTryMount();
</script>
{% endblock %}
