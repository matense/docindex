{% extends "base.html" %}
{% block title %}Login - DocIndex{% endblock %}
{% block auth_content %}
<div class="text-center mb-6">
    <h2 class="text-2xl font-bold">Welcome back</h2>
    <p class="text-sm opacity-60 mt-1">Sign in to continue to your drive</p>
</div>
<form method="POST" action="{{ url_for('auth.login') }}" class="flex flex-col gap-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="input input-bordered flex items-center gap-2">
        <i class="fas fa-user opacity-50"></i>
        <input type="text" name="username" class="grow" placeholder="Username" required autofocus>
    </label>
    <label class="input input-bordered flex items-center gap-2">
        <i class="fas fa-lock opacity-50"></i>
        <input type="password" name="password" class="grow" placeholder="Password" required>
    </label>
    <button type="submit" class="btn btn-primary w-full auth-submit">
        <i class="fas fa-arrow-right-to-bracket"></i> Login
    </button>
    {% if registration_enabled %}
    <p class="text-center text-sm opacity-70">
        No account? <a href="{{ url_for('auth.register') }}" class="link link-primary">Register</a>
    </p>
    {% endif %}
</form>
{% endblock %}
