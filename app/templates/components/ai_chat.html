<!-- AI chat window template — cloned once per chat session (multi-window). -->
<template id="ai-chat-window-tpl">
<div class="ai-chat-window glass-panel rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    <!-- Header (drag handle) -->
    <div class="acw-header flex items-center justify-between gap-2 px-4 py-2.5 border-b border-base-content/10 bg-gradient-to-r from-primary/10 to-secondary/10">
        <div class="flex items-center gap-2 font-bold text-sm whitespace-nowrap min-w-0">
            <span class="w-7 h-7 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center flex-shrink-0">
                <i class="fas fa-robot ai-robot-icon text-white text-xs"></i>
            </span>
            <div class="flex flex-col min-w-0">
                <span>DocIndex Assistant</span>
                <select title="Active model — switch between your configured AI connections"
                        class="acw-model-select select select-ghost select-xs -ml-2 h-5 min-h-0 font-normal font-mono text-[10px] opacity-70 max-w-44 hidden"></select>
            </div>
        </div>
        <div class="flex items-center gap-0.5 flex-shrink-0">
            <button type="button" class="btn btn-ghost btn-xs btn-circle ai-hdr-btn acw-autoscroll" title="Auto-scroll">
                <i class="fas fa-arrow-down-long"></i>
            </button>
            <button type="button" class="btn btn-ghost btn-xs btn-circle ai-hdr-btn acw-convs" title="Conversations">
                <i class="fas fa-clock-rotate-left"></i>
            </button>
            <button type="button" class="btn btn-ghost btn-xs btn-circle ai-hdr-btn acw-new-conv" title="Clear & start new chat">
                <i class="fas fa-broom"></i>
            </button>
            <div class="relative">
                <button type="button" class="btn btn-ghost btn-xs btn-circle ai-hdr-btn acw-more" title="More options">
                    <i class="fas fa-ellipsis"></i>
                </button>
                <div class="acw-more-menu hidden absolute right-0 top-full mt-1 glass-menu z-20 flex-col min-w-52 p-1.5">
                    <button type="button" class="ai-menu-item acw-new-window">
                        <i class="fas fa-clone w-5 text-center text-primary"></i> New parallel window
                    </button>
                    <div class="ai-menu-sep"></div>
                    <button type="button" class="ai-menu-item acw-dock-left"
                            title="Snap the chat to the left half (dual view)">
                        <i class="fas fa-arrow-left w-5 text-center text-primary"></i> Dock left
                        <span class="ai-menu-hint">Alt+←</span>
                    </button>
                    <button type="button" class="ai-menu-item acw-dock-right"
                            title="Snap the chat to the right half (dual view)">
                        <i class="fas fa-arrow-right w-5 text-center text-primary"></i> Dock right
                        <span class="ai-menu-hint">Alt+→</span>
                    </button>
                    <button type="button" class="ai-menu-item acw-undock" style="display:none"
                            title="Back to a floating window">
                        <i class="fas fa-window-restore w-5 text-center text-primary"></i> Undock
                        <span class="ai-menu-hint">Esc</span>
                    </button>
                    <div class="ai-menu-sep"></div>
                    <button type="button" class="ai-menu-item acw-summarize"
                            title="Summarize & reset history (AI compacts the conversation into a memory)">
                        <i class="fas fa-compress w-5 text-center text-primary"></i> Summarize &amp; reset
                    </button>
                    <button type="button" class="ai-menu-item acw-notify"
                            title="Browser notification when a background task finishes (works even in another tab)">
                        <i class="fas fa-bell-slash w-5 text-center text-primary"></i> <span>Notify on task finish</span>
                    </button>
                    <div class="ai-menu-sep"></div>
                    <a href="{{ url_for('settings.ai_settings') }}" class="ai-menu-item">
                        <i class="fas fa-gear w-5 text-center text-primary"></i> AI settings
                    </a>
                </div>
            </div>
            <button type="button" class="btn btn-ghost btn-xs btn-circle ai-hdr-btn acw-min" title="Minimize — the run keeps going in the dock">
                <i class="fas fa-minus"></i>
            </button>
            <button type="button" class="btn btn-ghost btn-xs btn-circle ai-hdr-btn acw-close" title="Close">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Conversation list -->
    <div class="acw-conv-list hidden flex-1 overflow-y-auto p-2 flex-col gap-1"></div>

    <!-- Messages -->
    <div class="acw-messages ai-messages flex-1 overflow-y-auto p-4 flex flex-col gap-3">
        <div class="text-center text-sm opacity-50 mt-8">
            <i class="fas fa-wand-magic-sparkles text-3xl text-primary/40 mb-2 block"></i>
            Ask anything about your files.<br>I'll search, read and connect the dots.
        </div>
    </div>

    <!-- Input area -->
    <div class="border-t border-base-content/10 relative">
        <!-- Mention dropdown (# quick search) -->
        <div class="acw-mention hidden absolute bottom-full left-3 right-3 mb-1 glass-menu max-h-48 overflow-y-auto z-10"></div>
        <!-- Jump to latest (auto-scroll paused) -->
        <button type="button" class="acw-jump ai-jump-pill hidden">
            <i class="fas fa-arrow-down"></i> New messages
        </button>
        <!-- Attachment chips -->
        <div class="acw-attachments hidden flex-wrap gap-1 px-3 pt-2"></div>
        <!-- Persona picker popup -->
        <div class="acw-persona-popup hidden absolute bottom-full left-3 right-3 mb-1 glass-menu z-10 flex flex-col max-h-72">
            <div class="p-2 border-b border-base-content/10">
                <input type="text" class="acw-persona-search input input-bordered input-xs w-full"
                       placeholder="Search personas… (e.g. translator, reviewer)">
            </div>
            <div class="acw-persona-list overflow-y-auto p-1"></div>
        </div>
        <!-- "+" attach/options menu -->
        <div class="acw-plus-menu hidden absolute bottom-full left-3 mb-1 glass-menu z-10 flex-col min-w-56 p-1.5">
            <button type="button" class="ai-menu-item acw-attach-here"
                    title="Attach the file open in the viewer (@here)">
                <i class="fas fa-at w-5 text-center text-primary"></i> Attach current file
                <span class="ai-menu-hint">@here</span>
            </button>
            <button type="button" class="ai-menu-item acw-attach-search"
                    title="Search files to attach (#)">
                <i class="fas fa-hashtag w-5 text-center text-primary"></i> Search files to attach
                <span class="ai-menu-hint">#</span>
            </button>
            <button type="button" class="ai-menu-item acw-attach-drive"
                    title="Scope the answer to a drive ($)">
                <i class="fas fa-hard-drive w-5 text-center text-accent"></i> Scope to a drive
                <span class="ai-menu-hint">$</span>
            </button>
            <button type="button" class="ai-menu-item acw-attach-upload"
                    title="Upload files from this device (saved to the open drive, or a drive you pick when read-only)">
                <i class="fas fa-cloud-arrow-up w-5 text-center text-primary"></i> Upload files…
            </button>
            <input type="file" class="acw-file-input hidden" multiple>
            <button type="button" class="ai-menu-item acw-attach-persona"
                    title="Give the AI a personality/skill (Agency persona library)">
                <i class="fas fa-masks-theater w-5 text-center text-secondary"></i> Choose a persona
            </button>
            <div class="ai-menu-sep"></div>
            <button type="button" class="ai-menu-item acw-deep-toggle"
                    title="Long horizon run — this message gets an extended step budget for complex tasks">
                <i class="fas fa-rocket w-5 text-center text-warning"></i> Long horizon run
                <span class="ai-menu-tog"></span>
            </button>
        </div>

        <!-- Composer -->
        <form class="acw-form ai-composer" data-no-spa>
            <textarea rows="1" placeholder="Ask about your files… (Shift+Enter for a new line)"
                      class="acw-input ai-input w-full bg-transparent focus:outline-none text-sm px-4 pt-3 pb-2" autocomplete="off"></textarea>
            <div class="flex items-center gap-1.5 px-2.5 pb-2.5">
                <button type="button" class="ai-plus-btn acw-plus" title="Attach &amp; options">
                    <i class="fas fa-plus"></i>
                </button>
                <span class="flex-1"></span>
                <button type="submit" class="ai-send-btn acw-send" title="Send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>

    <!-- Drag & drop overlay -->
    <div class="acw-drop-overlay hidden absolute inset-0 z-20 rounded-2xl border-2 border-dashed border-primary bg-primary/10 backdrop-blur-sm flex items-center justify-center">
        <div class="font-bold text-primary flex items-center gap-2"><i class="fas fa-cloud-arrow-up text-2xl"></i> Drop files to attach</div>
    </div>

    <!-- Resize grip -->
    <div class="acw-resize" title="Drag to resize"><i class="fas fa-grip-lines"></i></div>
</div>
</template>
