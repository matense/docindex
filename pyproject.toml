[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv/", ".venv/", "migrations/versions/", "instance/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app", "modules"]
omit = ["*/migrations/*", "*/tests/*", "venv/*"]
